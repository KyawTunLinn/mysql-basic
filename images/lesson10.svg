<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%"><defs><linearGradient id="macBg10" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient><linearGradient id="macHeader10" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#21262d"/><stop offset="100%" stop-color="#161b22"/></linearGradient><filter id="macShadow10" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/></filter></defs><rect width="800" height="450" rx="14" fill="url(#macBg10)" stroke="#30363d" stroke-width="1.5" filter="url(#macShadow10)"/><!-- Header --><path d="M 0 14 C 0 6, 6 0, 14 0 L 786 0 C 794 0, 800 6, 800 14 L 800 42 L 0 42 Z" fill="url(#macHeader10)"/><line x1="0" y1="42" x2="800" y2="42" stroke="#30363d" stroke-width="1"/><circle cx="24" cy="21" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/><circle cx="44" cy="21" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/><circle cx="64" cy="21" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/><text x="400" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">Lesson 10 — Filtering Data with WHERE &amp; Logical Operators</text><!-- Left: Funnel Graphic --><g filter="url(#macShadow10)"><!-- Funnel Top --><polygon points="50,75 310,75 270,165 90,165" fill="#1f6feb" stroke="#58a6ff" stroke-width="1"/><text x="180" y="115" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">All Table Rows (10,000)</text><!-- Funnel Middle --><polygon points="90,165 270,165 230,255 130,255" fill="#d29922" stroke="#f0883e" stroke-width="1"/><text x="180" y="205" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#0d1117" text-anchor="middle">WHERE Filter Conditions</text><!-- Funnel Bottom --><polygon points="130,255 230,255 200,325 160,325" fill="#238636" stroke="#7ee787" stroke-width="1"/><text x="180" y="285" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Filtered</text><!-- Result Box --><rect x="100" y="345" width="160" height="42" rx="8" fill="#238636" stroke="#7ee787"/><text x="180" y="371" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Matching Rows (42)</text></g><!-- Right: Operators Grid --><g filter="url(#macShadow10)"><rect x="350" y="65" width="410" height="340" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="350" y="65" width="410" height="32" rx="10" fill="#21262d"/><text x="370" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#58a6ff">MySQL WHERE Logical Operators</text><text x="370" y="118" font-family="SFMono-Regular, monospace" font-size="13" fill="#d29922">AND</text><text x="445" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Both conditions must be TRUE</text><text x="370" y="153" font-family="SFMono-Regular, monospace" font-size="13" fill="#d29922">OR</text><text x="445" y="153" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">At least one condition is TRUE</text><text x="370" y="188" font-family="SFMono-Regular, monospace" font-size="13" fill="#d29922">IN (...)</text><text x="445" y="188" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Match any value in set: <tspan fill="#79c0ff">IN ('A','B')</tspan></text><text x="370" y="223" font-family="SFMono-Regular, monospace" font-size="13" fill="#d29922">BETWEEN</text><text x="445" y="223" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Inclusive range: <tspan fill="#79c0ff">BETWEEN 10 AND 50</tspan></text><text x="370" y="258" font-family="SFMono-Regular, monospace" font-size="13" fill="#d29922">LIKE</text><text x="445" y="258" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Wildcard pattern: <tspan fill="#79c0ff">LIKE 'U%'</tspan></text><text x="370" y="293" font-family="SFMono-Regular, monospace" font-size="13" fill="#d29922">IS NULL</text><text x="445" y="293" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Checks for missing/null values</text><rect x="365" y="325" width="380" height="48" rx="6" fill="#0d1117" stroke="#30363d"/><text x="375" y="354" font-family="SFMono-Regular, monospace" font-size="11" fill="#79c0ff">WHERE <tspan fill="#f0f6fc">price &gt; 50 </tspan><tspan fill="#d29922">AND </tspan><tspan fill="#f0f6fc">city IN ('Yangon', 'Mandalay')</tspan></text></g></svg>
