<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%"><defs><linearGradient id="macBg09" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient><linearGradient id="macHeader09" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#21262d"/><stop offset="100%" stop-color="#161b22"/></linearGradient><filter id="macShadow09" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/></filter></defs><rect width="800" height="450" rx="14" fill="url(#macBg09)" stroke="#30363d" stroke-width="1.5" filter="url(#macShadow09)"/><!-- Header --><path d="M 0 14 C 0 6, 6 0, 14 0 L 786 0 C 794 0, 800 6, 800 14 L 800 42 L 0 42 Z" fill="url(#macHeader09)"/><line x1="0" y1="42" x2="800" y2="42" stroke="#30363d" stroke-width="1"/><circle cx="24" cy="21" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/><circle cx="44" cy="21" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/><circle cx="64" cy="21" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/><text x="400" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">Lesson 09 — UPDATE &amp; DELETE Safety Guard</text><!-- Left: Dangerous Card --><g filter="url(#macShadow09)"><rect x="40" y="65" width="340" height="350" rx="10" fill="#161b22" stroke="#ff7b72" stroke-width="1.5"/><rect x="40" y="65" width="340" height="35" rx="10" fill="#4c1d1d"/><text x="60" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#ff7b72"> DANGEROUS (No WHERE Clause)</text><rect x="55" y="115" width="310" height="45" rx="6" fill="#0d1117" stroke="#ff7b72"/><text x="65" y="142" font-family="SFMono-Regular, monospace" font-size="13" fill="#ff7b72">UPDATE <tspan fill="#f0f6fc">users </tspan>SET <tspan fill="#f0f6fc">status='Active';</tspan></text><rect x="55" y="170" width="310" height="45" rx="6" fill="#0d1117" stroke="#ff7b72"/><text x="65" y="197" font-family="SFMono-Regular, monospace" font-size="13" fill="#ff7b72">DELETE FROM <tspan fill="#f0f6fc">users;</tspan></text><rect x="55" y="230" width="310" height="165" rx="8" fill="#2d1515" stroke="#7d2727"/><text x="70" y="255" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#ff7b72"> Catastrophic Impact:</text><text x="70" y="282" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#ffa198">• Overwrites EVERY single row in table</text><text x="70" y="306" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#ffa198">• Deletes entire database irreversibly</text><text x="70" y="330" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#ffa198">• Causes production server downtime</text><text x="70" y="365" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#ff7b72">NEVER execute without WHERE</text></g><!-- Right: Safe Card --><g filter="url(#macShadow09)"><rect x="420" y="65" width="340" height="350" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/><rect x="420" y="65" width="340" height="35" rx="10" fill="#1b4b27"/><text x="440" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#7ee787"> SAFE (Targeted with WHERE)</text><rect x="435" y="115" width="310" height="45" rx="6" fill="#0d1117" stroke="#7ee787"/><text x="445" y="133" font-family="SFMono-Regular, monospace" font-size="12" fill="#79c0ff">UPDATE <tspan fill="#f0f6fc">users </tspan>SET <tspan fill="#f0f6fc">city=</tspan><tspan fill="#a5d6ff">'Yangon'</tspan></text><text x="445" y="150" font-family="SFMono-Regular, monospace" font-size="12" font-weight="bold" fill="#7ee787">WHERE <tspan fill="#f0f6fc">id = 5;</tspan></text><rect x="435" y="170" width="310" height="45" rx="6" fill="#0d1117" stroke="#7ee787"/><text x="445" y="188" font-family="SFMono-Regular, monospace" font-size="12" fill="#79c0ff">DELETE FROM <tspan fill="#f0f6fc">users</tspan></text><text x="445" y="205" font-family="SFMono-Regular, monospace" font-size="12" font-weight="bold" fill="#7ee787">WHERE <tspan fill="#f0f6fc">id = 5;</tspan></text><rect x="435" y="230" width="310" height="165" rx="8" fill="#122e1b" stroke="#238636"/><text x="450" y="255" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#7ee787"> Safe Protection:</text><text x="450" y="282" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#aff5b4">• Targets exactly 1 specific row ID</text><text x="450" y="306" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#aff5b4">• Leaves all other records untouched</text><text x="450" y="330" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#aff5b4">• Test query with SELECT first</text><text x="450" y="365" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#7ee787">Rule: Always SELECT before UPDATE/DELETE</text></g></svg>
