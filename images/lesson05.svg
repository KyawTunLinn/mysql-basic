<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%"><defs><linearGradient id="macBg05" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient><linearGradient id="macHeader05" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#21262d"/><stop offset="100%" stop-color="#161b22"/></linearGradient><filter id="macShadow05" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/></filter></defs><rect width="800" height="450" rx="14" fill="url(#macBg05)" stroke="#30363d" stroke-width="1.5" filter="url(#macShadow05)"/><!-- Header Bar --><path d="M 0 14 C 0 6, 6 0, 14 0 L 786 0 C 794 0, 800 6, 800 14 L 800 42 L 0 42 Z" fill="url(#macHeader05)"/><line x1="0" y1="42" x2="800" y2="42" stroke="#30363d" stroke-width="1"/><circle cx="24" cy="21" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/><circle cx="44" cy="21" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/><circle cx="64" cy="21" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/><text x="400" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">Lesson 05 — Essential First SQL Commands</text><!-- 4 Process Cards --><!-- Card 1 --><g filter="url(#macShadow05)"><rect x="40" y="70" width="340" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="40" y="70" width="340" height="32" rx="10" fill="#21262d"/><text x="60" y="91" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#58a6ff">Step 1: Inspect Server Databases</text><rect x="55" y="115" width="310" height="42" rx="6" fill="#0d1117" stroke="#30363d"/><text x="70" y="141" font-family="SFMono-Regular, monospace" font-size="14" font-weight="bold" fill="#d29922">SHOW DATABASES;</text><text x="55" y="195" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e">Lists all databases on current MySQL server</text></g><!-- Card 2 --><g filter="url(#macShadow05)"><rect x="420" y="70" width="340" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="420" y="70" width="340" height="32" rx="10" fill="#21262d"/><text x="440" y="91" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7ee787">Step 2: Create New Database</text><rect x="435" y="115" width="310" height="42" rx="6" fill="#0d1117" stroke="#30363d"/><text x="450" y="141" font-family="SFMono-Regular, monospace" font-size="14" font-weight="bold" fill="#d29922">CREATE DATABASE shop;</text><text x="435" y="195" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e">Creates a new empty database named "shop"</text></g><!-- Card 3 --><g filter="url(#macShadow05)"><rect x="40" y="245" width="340" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="40" y="245" width="340" height="32" rx="10" fill="#21262d"/><text x="60" y="266" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f0883e">Step 3: Select Active Database</text><rect x="55" y="290" width="310" height="42" rx="6" fill="#0d1117" stroke="#30363d"/><text x="70" y="316" font-family="SFMono-Regular, monospace" font-size="14" font-weight="bold" fill="#d29922">USE shop;</text><text x="55" y="370" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e">Switches active context to database "shop"</text></g><!-- Card 4 --><g filter="url(#macShadow05)"><rect x="420" y="245" width="340" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="420" y="245" width="340" height="32" rx="10" fill="#21262d"/><text x="440" y="266" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#d2a8ff">Step 4: Check Table List</text><rect x="435" y="290" width="310" height="42" rx="6" fill="#0d1117" stroke="#30363d"/><text x="450" y="316" font-family="SFMono-Regular, monospace" font-size="14" font-weight="bold" fill="#d29922">SHOW TABLES;</text><text x="435" y="370" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e">Displays all tables in the current active database</text></g><!-- Connecting Arrows --><polygon points="390,140 405,140 405,135 412,140 405,145 405,140" fill="#58a6ff"/><polygon points="390,315 405,315 405,310 412,315 405,320 405,315" fill="#58a6ff"/><text x="400" y="422" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">All SQL commands must end with a semicolon (;)</text></svg>
