<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%"><defs><linearGradient id="macBg14" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient><linearGradient id="macHeader14" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#21262d"/><stop offset="100%" stop-color="#161b22"/></linearGradient><filter id="macShadow14" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/></filter></defs><rect width="800" height="450" rx="14" fill="url(#macBg14)" stroke="#30363d" stroke-width="1.5" filter="url(#macShadow14)"/><!-- Header --><path d="M 0 14 C 0 6, 6 0, 14 0 L 786 0 C 794 0, 800 6, 800 14 L 800 42 L 0 42 Z" fill="url(#macHeader14)"/><line x1="0" y1="42" x2="800" y2="42" stroke="#30363d" stroke-width="1"/><circle cx="24" cy="21" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/><circle cx="44" cy="21" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/><circle cx="64" cy="21" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/><text x="400" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">Lesson 14 — Database Backup &amp; Restore Workflow</text><!-- Left: BACKUP Workflow --><g filter="url(#macShadow14)"><rect x="40" y="65" width="340" height="340" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="40" y="65" width="340" height="35" rx="10" fill="#21262d"/><text x="60" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#58a6ff"> BACKUP (Export Database)</text><!-- Source DB Icon --><rect x="55" y="120" width="125" height="65" rx="8" fill="#0d1117" stroke="#30363d"/><text x="117" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff" text-anchor="middle"> MySQL DB</text><text x="117" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Live database</text><!-- Arrow --><polygon points="190,150 215,150 215,145 225,153 215,161 215,156 190,156" fill="#58a6ff"/><!-- Backup File Icon --><rect x="235" y="120" width="125" height="65" rx="8" fill="#0d1117" stroke="#30363d"/><text x="297" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#d29922" text-anchor="middle"> backup.sql</text><text x="297" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">SQL Dump file</text><!-- CLI Command --><rect x="55" y="205" width="305" height="65" rx="8" fill="#0d1117" stroke="#30363d"/><text x="65" y="227" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#58a6ff">Export CLI Command:</text><text x="65" y="253" font-family="SFMono-Regular, monospace" font-size="12" fill="#d29922">mysqldump -u root -p shop &gt; backup.sql</text><text x="55" y="300" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">• Dumps schema structure + table records</text><text x="55" y="325" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">• Plain text SQL script easy to compress</text><text x="55" y="360" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#7ee787"> Schedule automated daily cron backups</text></g><!-- Right: RESTORE Workflow --><g filter="url(#macShadow14)"><rect x="420" y="65" width="340" height="340" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="420" y="65" width="340" height="35" rx="10" fill="#21262d"/><text x="440" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#7ee787"> RESTORE (Import Database)</text><!-- Backup File Icon --><rect x="435" y="120" width="125" height="65" rx="8" fill="#0d1117" stroke="#30363d"/><text x="497" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#d29922" text-anchor="middle"> backup.sql</text><text x="497" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">SQL Dump file</text><!-- Arrow --><polygon points="570,150 595,150 595,145 605,153 595,161 595,156 570,156" fill="#7ee787"/><!-- Target DB Icon --><rect x="615" y="120" width="125" height="65" rx="8" fill="#0d1117" stroke="#30363d"/><text x="677" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#7ee787" text-anchor="middle"> Restored DB</text><text x="677" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Active database</text><!-- CLI Command --><rect x="435" y="205" width="305" height="65" rx="8" fill="#0d1117" stroke="#30363d"/><text x="445" y="227" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#7ee787">Import CLI Command:</text><text x="445" y="253" font-family="SFMono-Regular, monospace" font-size="12" fill="#d29922">mysql -u root -p shop &lt; backup.sql</text><text x="435" y="300" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">• Recreates tables &amp; populates all rows</text><text x="435" y="325" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">• Ensure target database exists prior to import</text><text x="435" y="360" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#7ee787"> Disaster recovery &amp; server migration ready</text></g></svg>
