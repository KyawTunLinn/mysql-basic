<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%"><defs><linearGradient id="macBg13" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient><linearGradient id="macHeader13" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#21262d"/><stop offset="100%" stop-color="#161b22"/></linearGradient><filter id="macShadow13" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/></filter></defs><rect width="800" height="450" rx="14" fill="url(#macBg13)" stroke="#30363d" stroke-width="1.5" filter="url(#macShadow13)"/><!-- Header --><path d="M 0 14 C 0 6, 6 0, 14 0 L 786 0 C 794 0, 800 6, 800 14 L 800 42 L 0 42 Z" fill="url(#macHeader13)"/><line x1="0" y1="42" x2="800" y2="42" stroke="#30363d" stroke-width="1"/><circle cx="24" cy="21" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/><circle cx="44" cy="21" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/><circle cx="64" cy="21" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/><text x="400" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">Lesson 13 — Aggregations &amp; GROUP BY Pipeline</text><!-- Query Statement Header --><g filter="url(#macShadow13)"><rect x="40" y="65" width="720" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="60" y="95" font-family="SFMono-Regular, monospace" font-size="14" fill="#79c0ff">SELECT <tspan fill="#f0f6fc">category, </tspan><tspan fill="#d29922">COUNT(*)</tspan><tspan fill="#f0f6fc"> AS total_items, </tspan><tspan fill="#d29922">AVG(price)</tspan><tspan fill="#f0f6fc"> AS avg_price</tspan></text><text x="60" y="125" font-family="SFMono-Regular, monospace" font-size="14" fill="#79c0ff">FROM <tspan fill="#f0f6fc">products </tspan><tspan fill="#d29922">GROUP BY </tspan><tspan fill="#f0f6fc">category </tspan><tspan fill="#7ee787">HAVING </tspan><tspan fill="#f0f6fc">COUNT(*) &gt; 1;</tspan></text></g><!-- Function Badges --><g filter="url(#macShadow13)"><rect x="40" y="172" width="130" height="65" rx="8" fill="#161b22" stroke="#30363d"/><text x="105" y="198" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#58a6ff" text-anchor="middle">COUNT()</text><text x="105" y="220" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Row count</text><rect x="187" y="172" width="130" height="65" rx="8" fill="#161b22" stroke="#30363d"/><text x="252" y="198" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#7ee787" text-anchor="middle">SUM()</text><text x="252" y="220" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Total sum</text><rect x="335" y="172" width="130" height="65" rx="8" fill="#161b22" stroke="#30363d"/><text x="400" y="198" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#d29922" text-anchor="middle">AVG()</text><text x="400" y="220" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Mean average</text><rect x="482" y="172" width="130" height="65" rx="8" fill="#161b22" stroke="#30363d"/><text x="547" y="198" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#d2a8ff" text-anchor="middle">MAX()</text><text x="547" y="220" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Highest value</text><rect x="630" y="172" width="130" height="65" rx="8" fill="#161b22" stroke="#30363d"/><text x="695" y="198" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#ff7b72" text-anchor="middle">MIN()</text><text x="695" y="220" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Lowest value</text></g><!-- Output Grid --><g filter="url(#macShadow13)"><rect x="40" y="252" width="720" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="40" y="252" width="720" height="30" rx="10" fill="#21262d"/><text x="70" y="272" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#f0f6fc">category (GROUP BY)</text><text x="320" y="272" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#f0f6fc">total_items (COUNT)</text><text x="580" y="272" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#f0f6fc">avg_price (AVG)</text><rect x="55" y="292" width="690" height="30" rx="4" fill="#0d1117"/><text x="70" y="312" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Electronics</text><text x="320" y="312" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#d29922">12 items</text><text x="580" y="312" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#7ee787">$ 450.00</text><rect x="55" y="328" width="690" height="30" rx="4" fill="#0d1117"/><text x="70" y="348" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Accessories</text><text x="320" y="348" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#d29922">8 items</text><text x="580" y="348" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#7ee787">$ 35.50</text><text x="400" y="388" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">WHERE filters individual rows BEFORE grouping; HAVING filters aggregate groups AFTER grouping.</text></g></svg>
