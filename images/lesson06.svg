an> (</text><text x="77" y="170" font-family="SFMono-Regular, monospace" font-size="13" fill="#f0f6fc">id</text><text x="145" y="170" font-family="SFMono-Regular, monospace" font-size="13" fill="#f0883e">INT</text><text x="210" y="170" font-family="SFMono-Regular, monospace" font-size="12" fill="#7ee787">AUTO_INCREMENT</text><text x="77" y="202" font-family="SFMono-Regular, monospace" font-size="13" fill="#f0f6fc">name</text><text x="145" y="202" font-family="SFMono-Regular, monospace" font-size="13" fill="#f0883e">VARCHAR(100)</text><text x="270" y="202" font-family="SFMono-Regular, monospace" font-size="12" fill="#ff7b72">NOT NULL</text><text x="77" y="234" font-family="SFMono-Regular, monospace" font-size="13" fill="#f0f6fc">email</text><text x="145" y="234" font-family="SFMono-Regular, monospace" font-size="13" fill="#f0883e">VARCHAR(100)</text><text x="270" y="234" font-family="SFMono-Regular, monospace" font-size="12" fill="#ff7b72">UNIQUE</text><text x="77" y="266" font-family="SFMono-Regular, monospace" font-size="13" fill="#f0f6fc">price</text><text x="145" y="266" font-family="SFMono-Regular, monospace" font-size="13" fill="#f0883e">DECIMAL(10,2)</text><text x="77" y="298" font-family="SFMono-Regular, monospace" font-size="13" fill="#f0f6fc">created</text><text x="145" y="298" font-family="SFMono-Regular, monospace" font-size="13" fill="#f0883e">DATE</text><text x="77" y="335" font-family="SFMono-Regular, monospace" font-size="13" fill="#79c0ff">PRIMARY KEY <tspan fill="#f0f6fc">(id)</tspan></text><text x="62" y="370" font-family="SFMono-Regular, monospace" font-size="13" fill="#79c0ff">);</text></g><!-- Data Types Right Column --><g filter="url(#macShadow06)"><rect x="430" y="65" width="335" height="78" rx="8" fill="#161b22" stroke="#30363d"/><text x="445" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f0883e">INT / BIGINT</text><text x="445" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Whole Integers (e.g. 1, 42, 1005)</text><text x="445" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e">Ideal for Primary Keys &amp; counts</text><rect x="430" y="155" width="335" height="78" rx="8" fill="#161b22" stroke="#30363d"/><text x="445" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#58a6ff">VARCHAR(N) / TEXT</text><text x="445" y="202" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Variable Length Text (e.g. "Yangon")</text><text x="445" y="218" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e">Up to N max string characters</text><rect x="430" y="245" width="335" height="78" rx="8" fill="#161b22" stroke="#30363d"/><text x="445" y="270" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7ee787">DECIMAL(M,D)</text><text x="445" y="292" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Exact Decimals (e.g. 999.99)</text><text x="445" y="308" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e">Used for financial &amp; price data</text><rect x="430" y="335" width="335" height="80" rx="8" fill="#161b22" stroke="#30363d"/><text x="445" y="360" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#d2a8ff">DATE / DATETIME</text><text x="445" y="382" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Date / Time (YYYY-MM-DD)</text><text x="445" y="398" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e">Timestamps &amp; registration dates</text></g></svg>
