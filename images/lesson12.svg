<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%"><defs><linearGradient id="macBg12" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient><linearGradient id="macHeader12" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#21262d"/><stop offset="100%" stop-color="#161b22"/></linearGradient><filter id="macShadow12" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/></filter></defs><rect width="800" height="450" rx="14" fill="url(#macBg12)" stroke="#30363d" stroke-width="1.5" filter="url(#macShadow12)"/><!-- Header --><path d="M 0 14 C 0 6, 6 0, 14 0 L 786 0 C 794 0, 800 6, 800 14 L 800 42 L 0 42 Z" fill="url(#macHeader12)"/><line x1="0" y1="42" x2="800" y2="42" stroke="#30363d" stroke-width="1"/><circle cx="24" cy="21" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/><circle cx="44" cy="21" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/><circle cx="64" cy="21" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/><text x="400" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">Lesson 12 — SQL JOINs Venn Diagram Relational Model</text><!-- 4 Venn Diagram Boxes --><!-- 1. INNER JOIN --><g filter="url(#macShadow12)"><rect x="40" y="65" width="340" height="165" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="55" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#58a6ff">1. INNER JOIN</text><text x="365" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="end">Only Matching Rows</text><circle cx="160" cy="148" r="42" fill="#1f6feb" fill-opacity="0.3" stroke="#58a6ff" stroke-width="1.5"/><circle cx="210" cy="148" r="42" fill="#d29922" fill-opacity="0.3" stroke="#f0883e" stroke-width="1.5"/><!-- Intersection --><path d="M 185,110 A 42,42 0 0,1 185,186 A 42,42 0 0,1 185,110" fill="#58a6ff"/><text x="135" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">A</text><text x="235" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">B</text><text x="280" y="152" font-family="SFMono-Regular, monospace" font-size="11" fill="#d29922">A ∩ B</text></g><!-- 2. LEFT JOIN --><g filter="url(#macShadow12)"><rect x="420" y="65" width="340" height="165" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="435" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7ee787">2. LEFT JOIN (LEFT OUTER)</text><text x="745" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="end">All Left + Matching Right</text><circle cx="540" cy="148" r="42" fill="#238636" stroke="#7ee787" stroke-width="1.5"/><circle cx="590" cy="148" r="42" fill="none" stroke="#f0883e" stroke-width="1.5"/><text x="515" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">A</text><text x="615" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">B</text><text x="655" y="152" font-family="SFMono-Regular, monospace" font-size="11" fill="#7ee787">All A + (A∩B)</text></g><!-- 3. RIGHT JOIN --><g filter="url(#macShadow12)"><rect x="40" y="245" width="340" height="165" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="55" y="270" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f0883e">3. RIGHT JOIN (RIGHT OUTER)</text><text x="365" y="270" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="end">All Right + Matching Left</text><circle cx="160" cy="328" r="42" fill="none" stroke="#58a6ff" stroke-width="1.5"/><circle cx="210" cy="328" r="42" fill="#d29922" stroke="#f0883e" stroke-width="1.5"/><text x="135" y="332" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">A</text><text x="235" y="332" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">B</text><text x="280" y="332" font-family="SFMono-Regular, monospace" font-size="11" fill="#d29922">All B + (A∩B)</text></g><!-- 4. FULL OUTER JOIN --><g filter="url(#macShadow12)"><rect x="420" y="245" width="340" height="165" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="435" y="270" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#d2a8ff">4. FULL OUTER JOIN</text><text x="745" y="270" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="end">All Rows from Both Tables</text><circle cx="540" cy="328" r="42" fill="#8957e5" fill-opacity="0.8" stroke="#d2a8ff" stroke-width="1.5"/><circle cx="590" cy="328" r="42" fill="#8957e5" fill-opacity="0.8" stroke="#d2a8ff" stroke-width="1.5"/><text x="515" y="332" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">A</text><text x="615" y="332" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">B</text><text x="660" y="332" font-family="SFMono-Regular, monospace" font-size="11" fill="#d2a8ff">A ∪ B</text></g></svg>
