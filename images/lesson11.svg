<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%"><defs><linearGradient id="macBg11" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient><linearGradient id="macHeader11" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#21262d"/><stop offset="100%" stop-color="#161b22"/></linearGradient><filter id="macShadow11" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/></filter></defs><rect width="800" height="450" rx="14" fill="url(#macBg11)" stroke="#30363d" stroke-width="1.5" filter="url(#macShadow11)"/><!-- Header --><path d="M 0 14 C 0 6, 6 0, 14 0 L 786 0 C 794 0, 800 6, 800 14 L 800 42 L 0 42 Z" fill="url(#macHeader11)"/><line x1="0" y1="42" x2="800" y2="42" stroke="#30363d" stroke-width="1"/><circle cx="24" cy="21" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/><circle cx="44" cy="21" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/><circle cx="64" cy="21" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/><text x="400" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">Lesson 11 — Sorting (ORDER BY) &amp; Pagination (LIMIT / OFFSET)</text><!-- Left: ORDER BY --><g filter="url(#macShadow11)"><rect x="40" y="65" width="340" height="340" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="40" y="65" width="340" height="32" rx="10" fill="#21262d"/><text x="55" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#58a6ff">ORDER BY Column Sorting</text><rect x="55" y="110" width="310" height="40" rx="6" fill="#0d1117" stroke="#30363d"/><text x="70" y="135" font-family="SFMono-Regular, monospace" font-size="13" fill="#79c0ff">ORDER BY <tspan fill="#f0f6fc">price </tspan><tspan fill="#d29922">ASC</tspan></text><text x="270" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#7ee787"> Low → High</text><rect x="55" y="165" width="310" height="40" rx="6" fill="#0d1117" stroke="#30363d"/><text x="70" y="190" font-family="SFMono-Regular, monospace" font-size="13" fill="#79c0ff">ORDER BY <tspan fill="#f0f6fc">price </tspan><tspan fill="#d29922">DESC</tspan></text><text x="270" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#ff7b72"> High → Low</text><!-- Visual Stack --><rect x="55" y="225" width="310" height="35" rx="6" fill="#0d1117" stroke="#30363d"/><text x="75" y="247" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">1. Laptop Pro ($1,299.00)</text><rect x="55" y="270" width="310" height="35" rx="6" fill="#0d1117" stroke="#30363d"/><text x="75" y="292" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">2. 4K Monitor ($450.00)</text><rect x="55" y="315" width="310" height="35" rx="6" fill="#0d1117" stroke="#30363d"/><text x="75" y="337" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">3. Wireless Mouse ($25.50)</text><text x="210" y="385" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Default sorting direction is ASC (Ascending)</text></g><!-- Right: LIMIT & OFFSET --><g filter="url(#macShadow11)"><rect x="420" y="65" width="340" height="340" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="420" y="65" width="340" height="32" rx="10" fill="#21262d"/><text x="435" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#7ee787">LIMIT &amp; OFFSET Pagination</text><rect x="435" y="110" width="310" height="42" rx="6" fill="#0d1117" stroke="#30363d"/><text x="445" y="136" font-family="SFMono-Regular, monospace" font-size="13" fill="#79c0ff">LIMIT <tspan fill="#d29922">5 </tspan>OFFSET <tspan fill="#d29922">0</tspan></text><text x="640" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#7ee787"> Page 1 (1-5)</text><rect x="435" y="165" width="310" height="42" rx="6" fill="#0d1117" stroke="#30363d"/><text x="445" y="191" font-family="SFMono-Regular, monospace" font-size="13" fill="#79c0ff">LIMIT <tspan fill="#d29922">5 </tspan>OFFSET <tspan fill="#d29922">5</tspan></text><text x="640" y="191" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#7ee787"> Page 2 (6-10)</text><rect x="435" y="220" width="310" height="42" rx="6" fill="#0d1117" stroke="#30363d"/><text x="445" y="246" font-family="SFMono-Regular, monospace" font-size="13" fill="#79c0ff">LIMIT <tspan fill="#d29922">5 </tspan>OFFSET <tspan fill="#d29922">10</tspan></text><text x="640" y="246" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#7ee787"> Page 3 (11-15)</text><rect x="435" y="280" width="310" height="105" rx="8" fill="#122e1b" stroke="#238636"/><text x="450" y="305" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#7ee787"> Pagination Formula:</text><text x="450" y="330" font-family="SFMono-Regular, monospace" font-size="12" fill="#aff5b4">OFFSET = (page - 1) * limit</text><text x="450" y="355" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#aff5b4">Essential for Web App API pagination</text></g></svg>
