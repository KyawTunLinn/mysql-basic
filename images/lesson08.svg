<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%"><defs><linearGradient id="macBg08" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient><linearGradient id="macHeader08" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#21262d"/><stop offset="100%" stop-color="#161b22"/></linearGradient><filter id="macShadow08" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/></filter></defs><rect width="800" height="450" rx="14" fill="url(#macBg08)" stroke="#30363d" stroke-width="1.5" filter="url(#macShadow08)"/><!-- Header --><path d="M 0 14 C 0 6, 6 0, 14 0 L 786 0 C 794 0, 800 6, 800 14 L 800 42 L 0 42 Z" fill="url(#macHeader08)"/><line x1="0" y1="42" x2="800" y2="42" stroke="#30363d" stroke-width="1"/><circle cx="24" cy="21" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/><circle cx="44" cy="21" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/><circle cx="64" cy="21" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/><text x="400" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">Lesson 08 — Querying Data with SELECT</text><!-- Query 1: SELECT * --><g filter="url(#macShadow08)"><rect x="40" y="65" width="340" height="160" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="40" y="65" width="340" height="32" rx="10" fill="#21262d"/><text x="60" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f0883e">Select All Columns (*)</text><rect x="55" y="110" width="310" height="40" rx="6" fill="#0d1117" stroke="#30363d"/><text x="70" y="135" font-family="SFMono-Regular, monospace" font-size="13" fill="#d29922">SELECT * FROM products;</text><text x="55" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Returns every column in table</text><text x="55" y="198" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#ff7b72"> Higher memory &amp; bandwidth usage</text></g><!-- Query 2: Specific Columns + AS Alias --><g filter="url(#macShadow08)"><rect x="420" y="65" width="340" height="160" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="420" y="65" width="340" height="32" rx="10" fill="#21262d"/><text x="440" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#7ee787">Specific Columns &amp; Alias (AS)</text><rect x="435" y="105" width="310" height="50" rx="6" fill="#0d1117" stroke="#30363d"/><text x="445" y="125" font-family="SFMono-Regular, monospace" font-size="12" fill="#79c0ff">SELECT <tspan fill="#f0f6fc">name </tspan>AS <tspan fill="#d29922">item_name</tspan>,</text><text x="500" y="145" font-family="SFMono-Regular, monospace" font-size="12" fill="#f0f6fc">price <tspan fill="#79c0ff">FROM </tspan><tspan fill="#f0f6fc">products;</tspan></text><text x="435" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Optimized column projection</text><text x="435" y="202" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#7ee787"> Recommended best practice</text></g><!-- Output Result Grid --><g filter="url(#macShadow08)"><rect x="40" y="245" width="720" height="175" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="40" y="245" width="720" height="32" rx="10" fill="#21262d"/><text x="120" y="266" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#d29922">item_name (Alias)</text><text x="480" y="266" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#79c0ff">price ($)</text><!-- Row 1 --><rect x="55" y="290" width="690" height="32" rx="6" fill="#0d1117" stroke="#30363d"/><text x="120" y="311" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Laptop Pro 15"</text><text x="480" y="311" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#79c0ff">$ 1,299.00</text><!-- Row 2 --><rect x="55" y="330" width="690" height="32" rx="6" fill="#0d1117" stroke="#30363d"/><text x="120" y="351" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Wireless Mechanical Keyboard</text><text x="480" y="351" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#79c0ff">$ 89.50</text><text x="400" y="400" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Projection reduces memory footprint &amp; bandwidth consumption</text></g></svg>
