<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="macBgGuiCli" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="macHeaderGuiCli" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="macShadowGuiCli" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="450" rx="14" fill="url(#macBgGuiCli)" stroke="#30363d" stroke-width="1.5" filter="url(#macShadowGuiCli)"/>

  <!-- Header -->
  <path d="M 0 14 C 0 6, 6 0, 14 0 L 786 0 C 794 0, 800 6, 800 14 L 800 42 L 0 42 Z" fill="url(#macHeaderGuiCli)"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#30363d" stroke-width="1"/>

  <circle cx="24" cy="21" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/>
  <circle cx="44" cy="21" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/>
  <circle cx="64" cy="21" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/>

  <text x="400" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">MySQL Interface Options: Visual GUI vs Command Line CLI</text>

  <!-- Left: MySQL Workbench (GUI) -->
  <g filter="url(#macShadowGuiCli)">
    <rect x="40" y="65" width="340" height="340" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="40" y="65" width="340" height="35" rx="10" fill="#21262d"/>
    <text x="60" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#58a6ff">1. MySQL Workbench (Visual GUI)</text>

    <!-- Mock GUI controls -->
    <rect x="55" y="115" width="310" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="70" y="140" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#79c0ff">Local Instance 3306 [Run Query Button]</text>

    <rect x="55" y="165" width="100" height="150" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="65" y="185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" fill="#f0f6fc">SCHEMAS</text>
    <text x="65" y="205" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#58a6ff">shop</text>
    <text x="75" y="225" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#8b949e">customers</text>
    <text x="75" y="245" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#8b949e">products</text>
    <text x="75" y="265" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#8b949e">orders</text>

    <rect x="165" y="165" width="200" height="150" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="175" y="185" font-family="SFMono-Regular, monospace" font-size="10" fill="#d29922">SELECT * FROM shop;</text>
    <line x1="165" y1="200" x2="365" y2="200" stroke="#30363d"/>
    <text x="175" y="220" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#7ee787">id | name | city</text>
    <text x="175" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#c9d1d9">1  | U Ba | Yangon</text>

    <text x="210" y="340" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">Visual button clicks &amp; schema trees</text>
    <text x="210" y="365" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#7ee787" text-anchor="middle">Ideal for Beginners</text>
  </g>

  <!-- Right: Command Line CLI -->
  <g filter="url(#macShadowGuiCli)">
    <rect x="420" y="65" width="340" height="340" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="420" y="65" width="340" height="35" rx="10" fill="#21262d"/>
    <text x="440" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#7ee787">2. Command Line Client (Terminal CLI)</text>

    <!-- Terminal Box -->
    <rect x="435" y="115" width="310" height="200" rx="6" fill="#010409" stroke="#30363d"/>
    <text x="445" y="140" font-family="SFMono-Regular, monospace" font-size="11" fill="#7ee787">$ mysql -u root -p</text>
    <text x="445" y="165" font-family="SFMono-Regular, monospace" font-size="11" fill="#d29922">mysql&gt; USE shop;</text>
    <text x="445" y="190" font-family="SFMono-Regular, monospace" font-size="11" fill="#79c0ff">mysql&gt; SELECT * FROM customers;</text>
    <text x="445" y="215" font-family="SFMono-Regular, monospace" font-size="10" fill="#58a6ff">+----+------------+----------+</text>
    <text x="445" y="235" font-family="SFMono-Regular, monospace" font-size="10" fill="#58a6ff">| id | name       | city     |</text>
    <text x="445" y="255" font-family="SFMono-Regular, monospace" font-size="10" fill="#58a6ff">+----+------------+----------+</text>
    <text x="445" y="275" font-family="SFMono-Regular, monospace" font-size="10" fill="#c9d1d9">|  1 | U Ba       | Yangon   |</text>
    <text x="445" y="295" font-family="SFMono-Regular, monospace" font-size="10" fill="#58a6ff">+----+------------+----------+</text>

    <text x="590" y="340" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">Fast text scripts &amp; server automation</text>
    <text x="590" y="365" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#7ee787" text-anchor="middle">Ideal for Production &amp; DevOps</text>
  </g>
</svg>
