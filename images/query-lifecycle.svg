<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%"><defs><linearGradient id="macBgLife" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient><linearGradient id="macHeaderLife" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#21262d"/><stop offset="100%" stop-color="#161b22"/></linearGradient><filter id="macShadowLife" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/></filter></defs><rect width="800" height="450" rx="14" fill="url(#macBgLife)" stroke="#30363d" stroke-width="1.5" filter="url(#macShadowLife)"/><!-- Header --><path d="M 0 14 C 0 6, 6 0, 14 0 L 786 0 C 794 0, 800 6, 800 14 L 800 42 L 0 42 Z" fill="url(#macHeaderLife)"/><line x1="0" y1="42" x2="800" y2="42" stroke="#30363d" stroke-width="1"/><circle cx="24" cy="21" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/><circle cx="44" cy="21" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/><circle cx="64" cy="21" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/><text x="400" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">MySQL SQL Query Execution Lifecycle</text><!-- 5 Horizontal Flow Steps --><!-- Step 1: SQL Input --><g filter="url(#macShadowLife)"><rect x="30" y="80" width="130" height="280" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="30" y="80" width="130" height="30" rx="10" fill="#21262d"/><text x="95" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#58a6ff" text-anchor="middle">1. SQL Input</text><rect x="40" y="130" width="110" height="90" rx="6" fill="#0d1117" stroke="#30363d"/><text x="95" y="155" font-family="SFMono-Regular, monospace" font-size="10" fill="#79c0ff" text-anchor="middle">SELECT *</text><text x="95" y="175" font-family="SFMono-Regular, monospace" font-size="10" fill="#f0f6fc" text-anchor="middle">FROM users</text><text x="95" y="195" font-family="SFMono-Regular, monospace" font-size="10" fill="#d29922" text-anchor="middle">WHERE id=5;</text><text x="95" y="260" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Raw Query Text</text><text x="95" y="280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Sent via TCP/IP</text></g><!-- Arrow 1 --><polygon points="165,215 175,215 175,210 182,218 175,226 175,221 165,221" fill="#58a6ff"/><!-- Step 2: Parser --><g filter="url(#macShadowLife)"><rect x="185" y="80" width="130" height="280" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="185" y="80" width="130" height="30" rx="10" fill="#21262d"/><text x="250" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#79c0ff" text-anchor="middle">2. SQL Parser</text><rect x="195" y="130" width="110" height="90" rx="6" fill="#0d1117" stroke="#30363d"/><text x="250" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#79c0ff" text-anchor="middle">AST Tree</text><text x="250" y="185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Lexical &amp; Syntax</text><text x="250" y="260" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Validates Syntax</text><text x="250" y="280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">&amp; Table Schema</text></g><!-- Arrow 2 --><polygon points="320,215 330,215 330,210 337,218 330,226 330,221 320,221" fill="#79c0ff"/><!-- Step 3: Optimizer --><g filter="url(#macShadowLife)"><rect x="340" y="80" width="130" height="280" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="340" y="80" width="130" height="30" rx="10" fill="#21262d"/><text x="405" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#f0883e" text-anchor="middle">3. Optimizer</text><rect x="350" y="130" width="110" height="90" rx="6" fill="#0d1117" stroke="#30363d"/><text x="405" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#f0883e" text-anchor="middle">Cost Plan</text><text x="405" y="185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Index Selection</text><text x="405" y="260" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Selects Lowest</text><text x="405" y="280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Cost Index Path</text></g><!-- Arrow 3 --><polygon points="475,215 485,215 485,210 492,218 485,226 485,221 475,221" fill="#f0883e"/><!-- Step 4: Storage Engine --><g filter="url(#macShadowLife)"><rect x="495" y="80" width="130" height="280" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="495" y="80" width="130" height="30" rx="10" fill="#21262d"/><text x="560" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#7ee787" text-anchor="middle">4. Engine Read</text><rect x="505" y="130" width="110" height="90" rx="6" fill="#0d1117" stroke="#30363d"/><text x="560" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#7ee787" text-anchor="middle">InnoDB</text><text x="560" y="185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Buffer Pool / Disk</text><text x="560" y="260" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Fetches Row Data</text><text x="560" y="280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">from Data Pages</text></g><!-- Arrow 4 --><polygon points="630,215 640,215 640,210 647,218 640,226 640,221 630,221" fill="#7ee787"/><!-- Step 5: Result Set --><g filter="url(#macShadowLife)"><rect x="650" y="80" width="120" height="280" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="650" y="80" width="120" height="30" rx="10" fill="#21262d"/><text x="710" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#d2a8ff" text-anchor="middle">5. Result Set</text><rect x="660" y="130" width="100" height="90" rx="6" fill="#0d1117" stroke="#30363d"/><text x="710" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#d2a8ff" text-anchor="middle">Rows Back</text><text x="710" y="185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">JSON / Grid</text><text x="710" y="260" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Returns Data to</text><text x="710" y="280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Client App</text></g><!-- Bottom Note --><text x="400" y="415" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Sub-millisecond query execution workflow inside MySQL Server Core</text></svg>
