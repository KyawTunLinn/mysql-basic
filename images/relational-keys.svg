<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%"><defs><linearGradient id="macBgKey" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient><linearGradient id="macHeaderKey" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#21262d"/><stop offset="100%" stop-color="#161b22"/></linearGradient><filter id="macShadowKey" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/></filter></defs><rect width="800" height="450" rx="14" fill="url(#macBgKey)" stroke="#30363d" stroke-width="1.5" filter="url(#macShadowKey)"/><!-- Header --><path d="M 0 14 C 0 6, 6 0, 14 0 L 786 0 C 794 0, 800 6, 800 14 L 800 42 L 0 42 Z" fill="url(#macHeaderKey)"/><line x1="0" y1="42" x2="800" y2="42" stroke="#30363d" stroke-width="1"/><circle cx="24" cy="21" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/><circle cx="44" cy="21" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/><circle cx="64" cy="21" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/><text x="400" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">Relational Database Concept — Primary Key (PK) &amp; Foreign Key (FK)</text><!-- Left: Parent Table (customers) --><g filter="url(#macShadowKey)"><rect x="40" y="65" width="340" height="340" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="40" y="65" width="340" height="35" rx="10" fill="#21262d"/><text x="60" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#58a6ff">Parent Table: customers</text><!-- Table Header --><rect x="55" y="115" width="310" height="30" rx="6" fill="#0d1117"/><text x="70" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#79c0ff">id (PK)</text><text x="180" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#f0f6fc">first_name</text><text x="290" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#f0f6fc">city</text><!-- Row 1 --><rect x="55" y="155" width="310" height="32" rx="4" fill="#0d1117" stroke="#30363d"/><text x="70" y="176" font-family="SFMono-Regular, monospace" font-size="12" font-weight="bold" fill="#79c0ff">1</text><text x="180" y="176" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">U Ba</text><text x="290" y="176" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Yangon</text><!-- Row 2 --><rect x="55" y="195" width="310" height="32" rx="4" fill="#0d1117" stroke="#30363d"/><text x="70" y="216" font-family="SFMono-Regular, monospace" font-size="12" font-weight="bold" fill="#79c0ff">2</text><text x="180" y="216" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Daw Hla</text><text x="290" y="216" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Mandalay</text><rect x="55" y="250" width="310" height="135" rx="8" fill="#0d1117" stroke="#30363d"/><text x="70" y="275" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#79c0ff"> Primary Key (PK) Definition:</text><text x="70" y="300" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#c9d1d9">• Uniquely identifies each record</text><text x="70" y="322" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#c9d1d9">• CANNOT be NULL or duplicate</text><text x="70" y="344" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#c9d1d9">• Automatically creates B-Tree Index</text><text x="70" y="368" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#7ee787">Guarantees Record Identity</text></g><!-- Connecting FK Line --><path d="M 365,171 C 400,171 390,176 435,176" stroke="#d29922" stroke-width="2.5" stroke-dasharray="4,4" fill="none"/><polygon points="435,176 427,171 427,181" fill="#d29922"/><!-- Right: Child Table (orders) --><g filter="url(#macShadowKey)"><rect x="420" y="65" width="340" height="340" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="420" y="65" width="340" height="35" rx="10" fill="#21262d"/><text x="440" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#7ee787">Child Table: orders</text><!-- Table Header --><rect x="435" y="115" width="310" height="30" rx="6" fill="#0d1117"/><text x="445" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#79c0ff">id</text><text x="515" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#d29922">customer_id (FK)</text><text x="655" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#f0f6fc">total</text><!-- Row 1 --><rect x="435" y="155" width="310" height="32" rx="4" fill="#0d1117" stroke="#30363d"/><text x="445" y="176" font-family="SFMono-Regular, monospace" font-size="12" fill="#8b949e">101</text><text x="515" y="176" font-family="SFMono-Regular, monospace" font-size="12" font-weight="bold" fill="#d29922">1 (Ref U Ba)</text><text x="655" y="176" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">$ 1,299</text><!-- Row 2 --><rect x="435" y="195" width="310" height="32" rx="4" fill="#0d1117" stroke="#30363d"/><text x="445" y="216" font-family="SFMono-Regular, monospace" font-size="12" fill="#8b949e">102</text><text x="515" y="216" font-family="SFMono-Regular, monospace" font-size="12" font-weight="bold" fill="#d29922">2 (Ref Daw Hla)</text><text x="655" y="216" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">$ 25.50</text><rect x="435" y="250" width="310" height="135" rx="8" fill="#0d1117" stroke="#30363d"/><text x="450" y="275" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#d29922">🔗 Foreign Key (FK) Definition:</text><text x="450" y="300" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#c9d1d9">• References Primary Key of parent table</text><text x="450" y="322" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#c9d1d9">• Enforces Referential Integrity constraint</text><text x="450" y="344" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#c9d1d9">• Prevents orphaned order records</text><text x="450" y="368" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#7ee787">Interlocks Relational Data</text></g></svg>
