<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySQL Beginner Course</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='56' font-size='56'>🐬</text></svg>">
  <style>
    :root {
      --theme-color: #00758;
      --sidebar-width: 280px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Docsify -->
  <script>
    window.$docsify = {
      // General
      name: 'MySQL Beginner Course',
      repo: 'https://github.com/KyawTunLinn/mysql-basic',
      homepage: 'index.md',
      loadSidebar: false,
      subMaxLevel: 2,
      auto2top: true,
      transition: {
        page: 'fade-out',
        activate: 'slide-up',
      },

      // Search
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search lessons...',
        noData: 'No results.',
        depth: 3,
        hideOtherSidebarContent: false,
        namespace: 'mysql-basic',
      },

      // Plugins
      plugins: [
        function (hook, vm) {
          hook.ready(function () {
            // Fix code block rendering for long content
            document.querySelectorAll('pre').forEach(function (pre) {
              pre.style.maxHeight = '60vh';
              pre.style.overflow = 'auto';
            });
          });

          hook.doneEach(function () {
            // Update page title
            var h1 = document.querySelector('h1');
            if (h1) {
              document.title = h1.textContent + ' — MySQL Beginner Course';
            } else {
              document.title = 'MySQL Beginner Course';
            }
          });
        }
      ],

      // Markdown renderer
      markdown: {
        smartypants: true,
        renderLangs: {
          sql: 'sql',
        },
      },

      // Syntax highlighting
      highlight: {
        theme: {
          normal: [
            'https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/github.min.css',
          ],
          dark: [
            'https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/github-dark.min.css',
          ],
        },
      },
    };
  </script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Search plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>

  <!-- Syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/highlight.js"></script>

  <!-- Copy code button -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <!-- Emoji support -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>

  <!-- External link target -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/external-script.min.js"></script>
</body>
</html>
